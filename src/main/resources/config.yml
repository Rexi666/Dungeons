database:
  type: sqlite #Database type, can be 'sqlite' or 'mysql'.
  mysql: #MySQL configuration. Only modify if using MySQL.
    host: "localhost" #MySQL host address.
    port: 3306 #MySQL port number.
    database: "dungeons" #MySQL database name.
    username: "root" #MySQL username.
    password: "" #MySQL password.

times: # seconds
  pre_game: 25
  game: 300

reward-key:
  material: TRIPWIRE_HOOK
  custom-model-data: 10001
  name: "&6&lLlave de cofre adicional"
  lore:
    - "&7Permite reclamar un segundo"
    - "&7cofre al terminar una dungeon."
  consume: true

rewards:
  jungla:
    enabled: true

    # Tiempo durante el cual se pueden reclamar los cofres.
    expiration-seconds: 900

    # Número normal de cofres reclamables.
    default-claims: 1

    menu:
      title: "&8Recompensas: &5{dungeon}"
      size: 54

      info:
        slot: 4
        material: NETHER_STAR
        name: "&d&lResumen de la dungeon"
        lore:
          - "&7Dungeon: &f{dungeon}"
          - "&7Dificultad: &f{difficulty}"
          - "&7Puntuación: &e{score}"
          - ""
          - "&7Cofres reclamados: &f{claims}/{maximum_claims}"

      close:
        slot: 49
        material: BARRIER
        name: "&cCerrar"

    preview-menu:
      title: "&8Contenido: {chest}"
      size: 54

      confirm:
        slot: 40
        material: LIME_DYE
        name: "&a&lReclamar cofre"
        lore:
          - "&7Precio: {price}"
          - ""
          - "&eClic para confirmar"

      back:
        slot: 48
        material: ARROW
        name: "&eVolver"

      close:
        slot: 50
        material: BARRIER
        name: "&cCerrar"

    scoring:
      completion: 100
      boss-kill: 100

      remaining-time:
        enabled: true
        points-per-second: 1
        maximum: 150

      deaths:
        penalty-per-death: 25

    difficulty-modifiers:
      gamma:
        price-multiplier: 1.0
        score-multiplier: 1.0

      beta:
        price-multiplier: 1.5
        score-multiplier: 1.25

      alpha:
        price-multiplier: 2.5
        score-multiplier: 1.5

    chests:
      wood:
        enabled: true
        minimum-score: 0
        price: 0
        material: CHEST
        slot: 10
        name: "&f&lCofre de madera"
        lore:
          - "&7Recompensa básica."
          - ""
          - "&7Precio: {price}"
          - "&7Puntuación necesaria: &f{required_score}"
          - ""
          - "&eClic para revisar"

        locked-lore:
          - "&cCofre bloqueado"
          - ""
          - "&7Puntuación actual: &f{score}"
          - "&7Puntuación necesaria: &f{required_score}"

        rolls:
          minimum: 2
          maximum: 3

        allow-duplicates: false

        loot:
          coins_small:
            type: MONEY
            weight: 40
            amount:
              minimum: 500
              maximum: 1500
            display:
              material: GOLD_NUGGET
              name: "&6500-1.500 monedas"
              lore:
                - "&7Cantidad obtenida: &6{amount}"

          iron:
            type: ITEM
            weight: 35
            material: IRON_INGOT
            amount:
              minimum: 4
              maximum: 12
            display:
              name: "&fLingotes de hierro"
              lore:
                - "&7Cantidad obtenida: &f{amount}"

          dungeon_fragment:
            type: COMMAND
            weight: 25
            amount:
              minimum: 1
              maximum: 2
            commands:
              - "give {player} prismarine_shard {amount}"
            display:
              material: PRISMARINE_SHARD
              name: "&bFragmento de dungeon"
              lore:
                - "&7Cantidad obtenida: &f{amount}"

      gold:
        enabled: true
        minimum-score: 100
        price: 5000
        material: GOLD_BLOCK
        slot: 12
        name: "&6&lCofre de oro"
        lore:
          - "&7Recompensas poco comunes."
          - ""
          - "&7Precio: {price}"
          - "&7Puntuación necesaria: &f{required_score}"
          - ""
          - "&eClic para revisar"
        locked-lore:
          - "&cCofre bloqueado"
          - ""
          - "&7Puntuación actual: &f{score}"
          - "&7Puntuación necesaria: &f{required_score}"
        rolls:
          minimum: 3
          maximum: 4
        allow-duplicates: false
        loot:
          coins_medium:
            type: MONEY
            weight: 40
            amount:
              minimum: 1500
              maximum: 5000
            display:
              material: GOLD_INGOT
              name: "&6Monedas"
              lore:
                - "&7Cantidad obtenida: &6{amount}"

          diamonds:
            type: ITEM
            weight: 30
            material: DIAMOND
            amount:
              minimum: 2
              maximum: 6
            display:
              name: "&bDiamantes"
              lore:
                - "&7Cantidad: &f{amount}"

          experience:
            type: EXPERIENCE
            weight: 30
            amount:
              minimum: 100
              maximum: 300
            display:
              material: EXPERIENCE_BOTTLE
              name: "&aExperiencia"
              lore:
                - "&7Experiencia obtenida: &a{amount}"

      diamond:
        enabled: true
        minimum-score: 200
        price: 15000
        material: DIAMOND_BLOCK
        slot: 14
        name: "&b&lCofre de diamante"
        rolls:
          minimum: 3
          maximum: 5
        allow-duplicates: false
        loot:
          coins:
            type: MONEY
            weight: 45
            amount:
              minimum: 5000
              maximum: 12000
            display:
              material: GOLD_INGOT
              name: "&6Monedas"
              lore:
                - "&7Cantidad: &6{amount}"

          diamond:
            type: ITEM
            weight: 40
            material: DIAMOND
            amount:
              minimum: 4
              maximum: 12
            display:
              name: "&bDiamantes"
              lore:
                - "&7Cantidad: &f{amount}"

          rare_command:
            type: COMMAND
            weight: 15
            amount:
              minimum: 1
              maximum: 1
            commands:
              - "give {player} echo_shard {amount}"
            display:
              material: ECHO_SHARD
              name: "&dFragmento raro"

      emerald:
        enabled: true
        minimum-score: 300
        price: 40000
        material: EMERALD_BLOCK
        slot: 16
        name: "&a&lCofre de esmeralda"
        rolls:
          minimum: 4
          maximum: 5
        allow-duplicates: false
        loot:
          coins:
            type: MONEY
            weight: 50
            amount:
              minimum: 10000
              maximum: 25000
            display:
              material: GOLD_BLOCK
              name: "&6Monedas"
              lore:
                - "&7Cantidad: &6{amount}"

          emerald:
            type: ITEM
            weight: 35
            material: EMERALD
            amount:
              minimum: 8
              maximum: 24
            display:
              name: "&aEsmeraldas"
              lore:
                - "&7Cantidad: &f{amount}"

          rare:
            type: COMMAND
            weight: 15
            amount:
              minimum: 1
              maximum: 1
            commands:
              - "give {player} nether_star {amount}"
            display:
              material: NETHER_STAR
              name: "&dRecompensa excepcional"

      obsidian:
        enabled: true
        minimum-score: 400
        price: 100000
        material: OBSIDIAN
        slot: 30
        name: "&5&lCofre de obsidiana"
        rolls:
          minimum: 4
          maximum: 6
        allow-duplicates: false
        loot:
          coins:
            type: MONEY
            weight: 50
            amount:
              minimum: 25000
              maximum: 75000
            display:
              material: GOLD_BLOCK
              name: "&6Gran cantidad de monedas"
              lore:
                - "&7Cantidad: &6{amount}"

          netherite:
            type: ITEM
            weight: 30
            material: NETHERITE_SCRAP
            amount:
              minimum: 1
              maximum: 4
            display:
              name: "&8Restos de netherita"
              lore:
                - "&7Cantidad: &f{amount}"

          legendary:
            type: COMMAND
            weight: 5
            amount:
              minimum: 1
              maximum: 1
            commands:
              - "give {player} netherite_ingot {amount}"
            display:
              material: NETHERITE_INGOT
              name: "&6&lRecompensa legendaria"

          experience:
            type: EXPERIENCE
            weight: 15
            amount:
              minimum: 500
              maximum: 1500
            display:
              material: EXPERIENCE_BOTTLE
              name: "&aExperiencia"
              lore:
                - "&7Cantidad: &a{amount}"

      bedrock:
        enabled: true
        minimum-score: 500
        price: 250000
        material: BEDROCK
        slot: 32
        name: "&8&lCofre de bedrock"
        rolls:
          minimum: 5
          maximum: 7
        allow-duplicates: false
        loot:
          coins:
            type: MONEY
            weight: 50
            amount:
              minimum: 50000
              maximum: 150000
            display:
              material: GOLD_BLOCK
              name: "&6Fortuna"
              lore:
                - "&7Cantidad: &6{amount}"

          netherite:
            type: ITEM
            weight: 25
            material: NETHERITE_INGOT
            amount:
              minimum: 1
              maximum: 3
            display:
              name: "&8Lingotes de netherita"
              lore:
                - "&7Cantidad: &f{amount}"

          legendary:
            type: COMMAND
            weight: 3
            amount:
              minimum: 1
              maximum: 1
            commands:
              - "give {player} enchanted_golden_apple {amount}"
            display:
              material: ENCHANTED_GOLDEN_APPLE
              name: "&6&lRecompensa legendaria"

          experience:
            type: EXPERIENCE
            weight: 22
            amount:
              minimum: 1000
              maximum: 3000
            display:
              material: EXPERIENCE_BOTTLE
              name: "&aMucha experiencia"
              lore:
                - "&7Cantidad: &a{amount}"
