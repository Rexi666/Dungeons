        - "&8Precio: ${prize}"
        - ""
        - "&eClick para iniciar"

classes: # Cooldown en segundos
  world: "dungeon"
  healer:
    abilities:
      regeneracion: # Regeneración continua
        enabled: true
        name: "&dRegeneración"
      circulo_curación: # Cura a las personas que estén en el área
        enabled: true
        name: "&dCírculo de curación"
  mage:
    abilities:
      ovejas_guiadas: # Ovejas que explotan al llegar al mob. Lanzar con click derecho de espada
        enabled: true
        name: "&cOvejas guiadas"
        cooldown: 10
      tormenta_electrica: # Caen rayos al mob. Lanzar con shift-click derecho de espada
        enabled: true
        name: "&cTormenta eléctrica"
        cooldown: 20
  berserker:
    abilities:
      tomahok: # Tira un hacha al enemigo que le causa daño. Lanzar con click derecho de hacha
        enabled: true
        name: "&eTomahok"
        cooldown: 15
      ragnarok: # Regeneración, velocidad y armadura extra
        enabled: true
        name: "&eRagnarok"
  fletcher:
    abilities:
      disparo_explosivo: # Aleatoriamente lanza una flecha que explota
        enabled: true
        name: "&bDisparo explosivo"
        probability: 20 # sobre 100
      ametralladora: # Dispara flechas del inventario de forma rápida. Click izquierdo de arco
        enabled: true
        name: "&bAmetralladora"
        cooldown: 20
        arrows: 10
  tank:
    abilities:
      vida_defensa: # Vida y defensa extra
        enabled: true
        name: "&4Vida y defensa extra"
      castillo_piedra: # Sube la defensa. Click derecho de espada
        enabled: true
        name: "&4Castillo de piedra"
        cooldown: 15
        time: 10
      sismo: # Terremoto que hace daño mobs. Shift-Click derecho de espada
        enabled: true
        name: "&4Sismo"
        cooldown: 20

