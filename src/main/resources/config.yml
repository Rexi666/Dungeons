    abilities:
      tomahok: # Tira un hacha al enemigo que le causa daño. Lanzar con click derecho de hacha
        enabled: true
        name: "&eTomahok"
        cooldown: 15
      ragnarok: # Regeneración, velocidad y armadura extra
        enabled: true
        name: "&eRagnarok"
  fletcher:
    abilities:
      disparo_explosivo: # Aleatoriamente lanza una flecha que explota
        enabled: true
        name: "&bDisparo explosivo"
        probability: 20 # sobre 100
      ametralladora: # Dispara flechas del inventario de forma rápida. Click izquierdo de arco
