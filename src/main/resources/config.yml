classes: # Cooldown en segundos
  world: "dungeon"
  healer:
    abilities:
      regeneracion: # Regeneración continua
        enabled: true
        name: "&dRegeneración"
      circulo_curación: # Cura a las personas que estén en el área
        enabled: true
        name: "&dCírculo de curación"
  mage:
    abilities:
      ovejas_guiadas: # Ovejas que explotan al llegar al mob. Lanzar con click derecho de espada
        enabled: true
        name: "&cOvejas guiadas"
        cooldown: 10
