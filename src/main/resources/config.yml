graves:
  world: "dungeon"
  material: "OBSIDIAN" # Dejar JUGADOR para poner la cabeza del jugador
  holo: "&cTumba de {player} &7- &e{time}"

menu:
  title: "&fElige tu clase"
  info:
    general:
      name: "&7Información"
      material: BOOK
      slot: 4
      lore:
        - "&7Escoge tu clase"
        - ""
        - "&7Actualmente: {class}"
    close:
      name: "&cCerrar menú"
      material: BARRIER
      slot: 49
      lore: []
  classes:
    healer:
      name: "&dCurandero"
      material: GOLDEN_APPLE
      slot: 20
      lore:
        - "&7Nivel: {level}"
        - ""
        - "&7- Regeneración"
        - "&7- Círculo de curación"
    mage:
      name: "&cMago"
      material: BLAZE_ROD
      slot: 21
      lore:
        - "&7Nivel: {level}"
        - ""
        - "&7- Ovejas guiadas"
        - "&7- Tormenta eléctrica"
    berserker:
      name: "&eBerserker"
      material: IRON_AXE
      slot: 22
      lore:
        - "&7Nivel: {level}"
        - ""
        - "&7- Tomahok"
        - "&7- Ragnarok"
    fletcher:
      name: "&bArquero"
      material: ARROW
      slot: 23
      lore:
        - "&7Nivel: {level}"
        - ""
        - "&7- Disparo explosivo"
        - "&7- Arco ametralladora"
    tank:
      name: "&4Tanque"
      material: ANVIL
      slot: 24
      lore:
        - "&7Nivel: {level}"
        - ""
        - "&7- Vida y defensa extra"
        - "&7- Castillo de piedra"
        - "&7- Sismo"

start_menu:
  title: "&7Iniciar una dungeon"
  items:
    gamma:
      material: REDSTONE
      name: "&cGamma"
      prize: 10000
      slot: 20
      lore:
        - ""
        - "&7Iniciar esta dungeon"
        - "&7en dificultad Gamma"
        - "&8Precio: ${prize}"
        - ""
        - "&eClick para iniciar"
    beta:
      material: LAPIS_LAZULI
      name: "&2Beta"
      prize: 20000
      slot: 22
      lore:
        - ""
        - "&7Iniciar esta dungeon"
        - "&7en dificultad Beta"
        - "&8Precio: ${prize}"
        - ""
        - "&eClick para iniciar"
    alpha:
